name: hardened-pmos-build (linux-native)

# Fires when the hardening config or kernel recipe changes. Runs pmbootstrap
# DIRECTLY on the Linux runner (no Docker) — crossdirect works here, so the
# kernel build is reasonably fast.
on:
  push:
    paths:
      - 'config/**'
      - 'kernel/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'kernel/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    # Native aarch64 runner: the kernel compiles natively — no QEMU emulation and
    # no crossdirect — the fastest path. The aarch64 chroot runs directly.
    # (Revert to ubuntu-latest for x86 cross-compile; that also needs the QEMU
    # "aarch64 binfmt" step restored so the runner can run aarch64 chroots.)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build.sh reads HEAD commit time for SOURCE_DATE_EPOCH

      - name: Load build pins
        id: pins
        run: |
          set -a; . config/build.env; set +a
          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR:-out}" >> "$GITHUB_OUTPUT"

      - name: Install pmbootstrap + host tools
        run: |
          sh scripts/setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Persist the ccache across runs so repeated kernel builds are faster.
      - name: Restore kernel ccache
        uses: actions/cache@v4
        with:
          path: ~/.local/var/pmbootstrap/cache_ccache_${{ steps.pins.outputs.arch }}
          key: ccache-${{ hashFiles('kernel/**', 'config/disabled-subsystems.fragment') }}
          restore-keys: ccache-

      - name: Build hardened image + verify
        run: |
          sh scripts/build.sh
          sh scripts/verify-disabled.sh

      - name: Upload image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardened-pmos-image
          path: ${{ steps.pins.outputs.output_dir }}/**
          if-no-files-found: warn
